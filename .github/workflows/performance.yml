name: Performance Monitoring

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Run performance audit daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  performance-audit:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build project
      run: npm run build
      
    - name: Start preview server
      run: |
        npm run preview &
        sleep 10
      
    - name: Install Lighthouse CI
      run: npm install -g @lhci/cli
      
    - name: Run Lighthouse CI
      run: |
        lhci autorun --upload.target=temporary-public-storage
      env:
        LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
        
    - name: Run custom performance audit
      run: npm run perf:audit
      env:
        SITE_URL: http://localhost:4321
        
    - name: Upload performance reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: performance-reports
        path: performance-reports/
        retention-days: 30
        
    - name: Comment PR with performance results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          
          try {
            const summaryPath = path.join('performance-reports', 'latest-summary.json');
            if (fs.existsSync(summaryPath)) {
              const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
              
              const comment = `## 🚀 Performance Audit Results
              
              ### Lighthouse Scores
              - **Performance**: ${summary.scores.performance}% ${summary.scores.performance >= 90 ? '✅' : '❌'}
              - **Accessibility**: ${summary.scores.accessibility}% ${summary.scores.accessibility >= 95 ? '✅' : '❌'}
              - **Best Practices**: ${summary.scores.bestPractices}% ${summary.scores.bestPractices >= 90 ? '✅' : '❌'}
              - **SEO**: ${summary.scores.seo}% ${summary.scores.seo >= 95 ? '✅' : '❌'}
              
              ### Core Web Vitals
              - **LCP**: ${summary.webVitals.lcp}ms ${summary.webVitals.lcp <= 2500 ? '✅' : '❌'}
              - **FID**: ${summary.webVitals.fid}ms ${summary.webVitals.fid <= 100 ? '✅' : '❌'}
              - **CLS**: ${summary.webVitals.cls} ${summary.webVitals.cls <= 0.1 ? '✅' : '❌'}
              
              *Audit completed at: ${new Date(summary.timestamp).toLocaleString()}*
              `;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }
          } catch (error) {
            console.log('Could not post performance results:', error.message);
          }

  lighthouse-ci:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build project
      run: npm run build
      
    - name: Run Lighthouse CI
      uses: treosh/lighthouse-ci-action@v11
      with:
        configPath: '.lighthouserc.json'
        uploadArtifacts: true
        temporaryPublicStorage: true
