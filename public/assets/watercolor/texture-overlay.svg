<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft watercolor gradient -->
    <radialGradient id="watercolorGradient1" cx="30%" cy="30%" r="50%">
      <stop offset="0%" stop-color="rgba(251, 207, 232, 0.3)" />
      <stop offset="50%" stop-color="rgba(251, 207, 232, 0.1)" />
      <stop offset="100%" stop-color="rgba(251, 207, 232, 0.05)" />
    </radialGradient>

    <radialGradient id="watercolorGradient2" cx="70%" cy="80%" r="45%">
      <stop offset="0%" stop-color="rgba(233, 213, 255, 0.25)" />
      <stop offset="50%" stop-color="rgba(233, 213, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(233, 213, 255, 0.03)" />
    </radialGradient>

    <radialGradient id="watercolorGradient3" cx="60%" cy="40%" r="40%">
      <stop offset="0%" stop-color="rgba(255, 247, 245, 0.2)" />
      <stop offset="50%" stop-color="rgba(255, 247, 245, 0.07)" />
      <stop offset="100%" stop-color="rgba(255, 247, 245, 0.02)" />
    </radialGradient>

    <radialGradient id="watercolorGradient4" cx="20%" cy="70%" r="35%">
      <stop offset="0%" stop-color="rgba(250, 204, 21, 0.15)" />
      <stop offset="50%" stop-color="rgba(250, 204, 21, 0.05)" />
      <stop offset="100%" stop-color="rgba(250, 204, 21, 0.01)" />
    </radialGradient>
  </defs>

  <!-- Watercolor blob shapes -->
  <ellipse cx="120" cy="120" rx="80" ry="60" fill="url(#watercolorGradient1)" opacity="0.6">
    <animateTransform
      attributeName="transform"
      type="rotate"
      values="0 120 120;5 120 120;-3 120 120;0 120 120"
      dur="25s"
      repeatCount="indefinite" />
  </ellipse>

  <ellipse cx="280" cy="320" rx="70" ry="50" fill="url(#watercolorGradient2)" opacity="0.5">
    <animateTransform
      attributeName="transform"
      type="rotate"
      values="0 280 320;-4 280 320;6 280 320;0 280 320"
      dur="30s"
      repeatCount="indefinite" />
  </ellipse>

  <ellipse cx="240" cy="160" rx="60" ry="45" fill="url(#watercolorGradient3)" opacity="0.4">
    <animateTransform
      attributeName="transform"
      type="rotate"
      values="0 240 160;3 240 160;-5 240 160;0 240 160"
      dur="35s"
      repeatCount="indefinite" />
  </ellipse>

  <ellipse cx="80" cy="280" rx="55" ry="40" fill="url(#watercolorGradient4)" opacity="0.3">
    <animateTransform
      attributeName="transform"
      type="rotate"
      values="0 80 280;-2 80 280;4 80 280;0 80 280"
      dur="40s"
      repeatCount="indefinite" />
  </ellipse>

  <!-- Additional soft watercolor shapes -->
  <circle cx="350" cy="80" r="40" fill="url(#watercolorGradient1)" opacity="0.2">
    <animateTransform
      attributeName="transform"
      type="scale"
      values="1;1.1;0.9;1"
      dur="20s"
      repeatCount="indefinite" />
  </circle>

  <ellipse cx="60" cy="200" rx="45" ry="30" fill="url(#watercolorGradient2)" opacity="0.25">
    <animateTransform
      attributeName="transform"
      type="rotate"
      values="0 60 200;2 60 200;-2 60 200;0 60 200"
      dur="45s"
      repeatCount="indefinite" />
  </ellipse>

  <!-- Subtle brush stroke effects -->
  <path d="M 150 50 Q 180 30 200 60 Q 220 80 180 100 Q 160 110 140 90 Q 120 70 150 50"
        fill="url(#watercolorGradient3)"
        opacity="0.15">
    <animateTransform
      attributeName="transform"
      type="translate"
      values="0,0;5,-3;-3,4;0,0"
      dur="50s"
      repeatCount="indefinite" />
  </path>

  <path d="M 300 250 Q 320 230 350 240 Q 370 260 340 280 Q 320 290 300 270 Q 280 250 300 250"
        fill="url(#watercolorGradient4)"
        opacity="0.2">
    <animateTransform
      attributeName="transform"
      type="translate"
      values="0,0;-4,2;3,-3;0,0"
      dur="55s"
      repeatCount="indefinite" />
  </path>
</svg>
