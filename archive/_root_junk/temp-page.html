:root{
  /* Cursed Ink Society Brand Colors - Gothic/Modern Fusion */
  --bg0:#0a0a0c; --bg1:#0f0a10; /* Deeper blacks for gothic feel */
  --accent0:#dc143c; --accent1:#b22222; --ink:#f5f5f5; /* Crimson red, deeper red, clean white */
  --gold:#d4af37; --silver:#c0c0c0; /* Metallic accents */
  --glow-primary: 0 0 12px rgba(220, 20, 60, 0.6), 0 0 24px rgba(220, 20, 60, 0.3), 0 0 36px rgba(220, 20, 60, 0.1);
  --glow-subtle: 0 0 6px rgba(220, 20, 60, 0.4);
  --glow-gold: 0 0 8px rgba(212, 175, 55, 0.5), 0 0 16px rgba(212, 175, 55, 0.2);
  --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  --border-glass: 1px solid rgba(255,255,255,.12);
  --bg-glass: rgba(255,255,255,.04);
}
*{box-sizing:border-box}
*::before, *::after{box-sizing:border-box}
html{
  scroll-behavior: smooth;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
html,body{height:100%}
body{
  margin:0; color:var(--ink);
  background:
    radial-gradient(ellipse at 20% 30%, rgba(255, 60, 43, 0.15) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 70%, rgba(255, 122, 24, 0.1) 0%, transparent 50%),
    linear-gradient(135deg, #0b0b0d 0%, #1a1a1f 50%, #0b0b0d 100%);
  background-attachment: fixed;
  font-family:"Cinzel Variable", ui-serif, Georgia, serif;
  font-display: swap;
  line-height: 1.6;
  
  /* iOS Safari safe area support */
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
  padding-bottom: env(safe-area-inset-bottom);
}
/* iOS Safari viewport fix */
@supports (-webkit-touch-callout: none) {
  .hero {
    min-height: -webkit-fill-available;
  }
}
/* Reduced motion support */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
  html { scroll-behavior: auto; }
}
a{color:inherit;text-decoration:none}
.container{max-width:1100px; margin:0 auto; padding:0 1.2rem}
.badge{font-size:.78rem; letter-spacing:.14em; text-transform:uppercase;
  display:inline-block; padding:.35rem .6rem; border-radius:999px;
  border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.03)}
.logo{height:140px; width:auto; filter:drop-shadow(0 0 20px rgba(255,70,35,.45))}
h1{font-size:clamp(2.4rem,6vw,4.6rem); line-height:.96; margin:.8rem 0 1rem}
.shine{
  background:conic-gradient(from 220deg at 50% 50%, #ffd7b8, #ff6a3d, #ff3c2b, #ffb45a, #ffd7b8);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 0 18px rgba(255,90,40,.3));
}
.hero{position:relative; min-height:92vh; display:grid; place-items:center; text-align:center; overflow:hidden}
.hero canvas{position:absolute; inset:0; width:100%; height:100%; z-index:0}
.hero .content{position:relative; z-index:1}
.row{display:flex; gap:1rem; justify-content:center; flex-wrap:wrap}
.btn{
  display:inline-flex; align-items:center; gap:.6rem;
