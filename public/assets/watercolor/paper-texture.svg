<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft paper texture gradient -->
    <radialGradient id="paperGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255, 247, 245, 0.1)" />
      <stop offset="30%" stop-color="rgba(251, 207, 232, 0.05)" />
      <stop offset="60%" stop-color="rgba(233, 213, 255, 0.03)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </radialGradient>

    <!-- Subtle watercolor spots -->
    <pattern id="watercolorPattern" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="2" fill="rgba(251, 207, 232, 0.1)" />
      <circle cx="35" cy="25" r="1.5" fill="rgba(233, 213, 255, 0.08)" />
      <circle cx="20" cy="40" r="1" fill="rgba(255, 247, 245, 0.06)" />
      <ellipse cx="45" cy="15" rx="2" ry="1" fill="rgba(250, 204, 21, 0.04)" />
    </pattern>
  </defs>

  <!-- Base watercolor wash -->
  <rect width="200" height="200" fill="url(#paperGradient)" />

  <!-- Subtle watercolor pattern overlay -->
  <rect width="200" height="200" fill="url(#watercolorPattern)" opacity="0.6" />

  <!-- Very subtle brush stroke lines -->
  <path d="M 0 100 Q 50 95 100 100 Q 150 105 200 100"
        stroke="rgba(251, 207, 232, 0.1)"
        stroke-width="1"
        fill="none"
        opacity="0.3" />

  <path d="M 0 150 Q 40 148 80 150 Q 120 152 160 150 Q 190 148 200 150"
        stroke="rgba(233, 213, 255, 0.08)"
        stroke-width="0.5"
        fill="none"
        opacity="0.4" />
</svg>
